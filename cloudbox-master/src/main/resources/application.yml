server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cloudbox}
    username: ${PGUSER:cloudbox}
    password: ${PGPASSWORD:cloudbox}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

cloudbox:
  security:
    jwt:
      secret: ${JWT_SECRET:Y2xvdWRib3gtZGV2LWp3dC1zZWNyZXQtbXVzdC1iZS1hdC1sZWFzdC0zMi1ieXRlcw==}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  heartbeat:
    timeout-seconds: 30
    check-interval-seconds: 10
  scheduler:
    max-temperature-celsius: 75
