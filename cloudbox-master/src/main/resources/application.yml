server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudbox
    username: cloudbox
    password: cloudbox
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

cloudbox:
  heartbeat:
    timeout-seconds: 30
    check-interval-seconds: 10
  scheduler:
    max-temperature-celsius: 75