cloudbox:
  agent:
    master-url: ${CLOUDBOX_MASTER_URL:https://cloudbox-production-55f7.up.railway.app/}
    name: ${AGENT_NAME:${HOSTNAME:cloudbox-agent}}
    advertise-address: ${AGENT_ADVERTISE_ADDRESS:}
    auto-detect-advertise-address: ${AGENT_AUTO_DETECT_ADVERTISE_ADDRESS:true}
    port-bind-address: ${AGENT_PORT_BIND_ADDRESS:0.0.0.0}
    token-file: ${AGENT_TOKEN_FILE:${user.home}/.cloudbox/agent-credentials.properties}
    heartbeat-interval: ${AGENT_HEARTBEAT_INTERVAL:10000}
    heartbeat-initial-delay: ${AGENT_HEARTBEAT_INITIAL_DELAY:2000}
    command-poll-interval: ${AGENT_COMMAND_POLL_INTERVAL:5000}
    command-poll-initial-delay: ${AGENT_COMMAND_POLL_INITIAL_DELAY:3000}
    docker:
      host: ${DOCKER_HOST:}
      connection-timeout: ${DOCKER_CONNECTION_TIMEOUT:5s}
      response-timeout: ${DOCKER_RESPONSE_TIMEOUT:30s}
      validation:
        enabled: ${DOCKER_VALIDATION_ENABLED:false}
        image: ${DOCKER_VALIDATION_IMAGE:nginx:alpine}
    metrics:
      interval: ${AGENT_METRICS_INTERVAL:5000}
      initial-delay: ${AGENT_METRICS_INITIAL_DELAY:1000}
